[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

; Standalone MPU6050 debug program — independent of the balance firmware in
; src/main.cpp. Compiles debug_mpu/main.cpp instead, but still picks up lib/
; automatically (PlatformIO scans lib/ for every env), so it reuses the real
; lib/MPU6050 driver with no copying/duplication.
[env:mpu_debug]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
src_dir = debug_mpu
; Reuse esp32dev's sdkconfig (tracked in git) instead of letting PlatformIO
; auto-generate a fresh sdkconfig.mpu_debug: a freshly generated sdkconfig
; defaults to promoting -Wmissing-field-initializers to a hard error
; (CONFIG_COMPILER_DISABLE_DEFAULT_ERRORS unset), which then fails to build
; existing lib/ code (e.g. SimplePWM.cpp) that this debug env must not modify.
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev


